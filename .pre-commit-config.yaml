# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  skip: [spec0-check]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: requirements-txt-fixer
  - repo: https://github.com/mirrors-prettier/mirrors-prettier
    rev: v3.8.3
    hooks:
      - id: prettier
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --select=ALL]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [--install-types, --non-interactive, --exclude=docs/conf.py]
        additional_dependencies:
          - pytest-stub
          - matplotlib
  - repo: local
    hooks:
      - id: spec0-check
        name: SPEC0 dependency check
        entry: python -u scripts/check_spec0.py
        language: python
        additional_dependencies:
          - packaging
        pass_filenames: false
