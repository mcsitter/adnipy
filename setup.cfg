[coverage:run]
branch = True

[tox:tox]
envlist =
	py{312,313,314}-pandas{2,3}
	doc8

[testenv:doc8]
deps =
	sphinx
	doc8
commands =
	doc8 docs

[testenv]
setenv =
	PYTHONPATH = {toxinidir}
deps =
	coverage
	pytest
	sphinx_rtd_theme
	pandas2: pandas>=2,<3
	pandas3: pandas>=3
commands =
	coverage run -a -m pytest --basetemp={envtmpdir}

[testenv:pandas2]
commands =
	coverage run -a -m pytest --basetemp={envtmpdir} -W ignore:"The 'generic' unit for NumPy timedelta is deprecated":DeprecationWarning
